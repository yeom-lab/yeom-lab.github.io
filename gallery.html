<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery | Laboratory of Bacterial Physiology</title>
  <link rel="stylesheet" href="style.css?v=13">
  <style>
    /* 사진 설명 가운데 정렬 */
    .gallery figcaption { text-align: center; }
  </style>
</head>
<body>
  <main class="wrap">
    <h1 class="page-title">Gallery</h1>

    <!-- 사진 올리는 방법
         1) 사진을 해당 연도 폴더에 넣습니다. (예: images/gallery/2026/2026-05-lab-outing.jpg)
         2) 같은 연도 안에서 <figure>…</figure> 한 덩어리를 복사해 붙이고
            파일 이름과 설명(figcaption)만 바꿉니다.
         3) 새 연도는 <section class="gallery-year"> … </section> 전체를 복사해
            맨 위에 붙이고 연도와 폴더 이름을 바꿉니다. (예: 2027, images/gallery/2027/)
         * 사진은 가로 2000px 이하로 줄여서 올리면 페이지가 빨리 열립니다. -->

    <section class="gallery-year">
      <h2 class="pub-year">2026</h2>
      <div class="gallery">
        <figure>
          <img src="images/gallery/2026/2026-01-new-year-lunch-1.jpg" alt="Lab members at the New Year lunch, January 2026" loading="lazy">
          <figcaption>New Year lunch, January 2026</figcaption>
        </figure>
        <figure>
          <img src="images/gallery/2026/2026-sim-hoseok-phd-graduation.jpg" alt="Ho Seok Sim's Ph.D. graduation with lab members" loading="lazy">
          <figcaption>Ho Seok Sim's Ph.D. graduation</figcaption>
        </figure>
        <figure class="album">
          <figcaption>Visit of Prof. Eduardo Groisman</figcaption>
          <div class="album-photos">
            <img src="images/gallery/2026/2026-groisman-visit-1.jpg" alt="Visit of Prof. Eduardo Groisman" data-caption="">
            <img src="images/gallery/2026/2026-groisman-visit-3.jpg" alt="Prof. Eduardo Groisman and Jinki Yeom by a pond" data-caption="">
          </div>
        </figure>
        <figure class="album">
          <figcaption>Antibiotic Resistance Symposium 2026, SNUCM</figcaption>
          <div class="album-photos">
            <img src="images/gallery/2026/2026-amr-symposium-snucm-1.jpg" alt="Lab members at the Antibiotic Resistance Symposium 2026, SNUCM" data-caption="">
            <img src="images/gallery/2026/2026-amr-symposium-snucm-2.jpg" alt="Lab members in front of the Antibiotic Resistance Symposium 2026 screen, SNUCM" data-caption="">
            <img src="images/gallery/2026/2026-amr-symposium-snucm-3.jpg" alt="Lab members at the Antibiotic Resistance Symposium 2026, SNUCM" data-caption="">
          </div>
        </figure>
        <!-- 앨범: 여러 장을 한 칸에 모아 보여줍니다.
             사진 추가는 album-photos 안에 <img …> 한 줄을 복사해서 넣으세요.
             data-caption 은 확대해서 볼 때 나오는 사진별 설명입니다. 첫 번째 사진이 표지가 됩니다. -->
        <figure class="album">
          <figcaption>2026 Annual Meeting of the MSK</figcaption>
          <div class="album-photos">
            <img src="images/gallery/2026/2026-10-msk-gs-presentation-park-minkyung.jpg" alt="Min-Kyung Park presenting at the MSK 2026 Graduate Student Session" data-caption="Min-Kyung Park, presenting at the Graduate Student (GS) Session">
            <img src="images/gallery/2026/2026-10-msk-gs-session-chair.jpg" alt="Chair of the Graduate Student session at MSK 2026" data-caption="Jinki Yeom, Chair of the GS session">
            <img src="images/gallery/2026/2026-10-msk-best-oral-award-group.jpg" alt="Best Oral Presentation Award ceremony at MSK 2026" data-caption="Min-Kyung Park, Best Oral Presentation Award">
            <img src="images/gallery/2026/2026-10-msk-signal-transduction-symposium.jpg" alt="Presentation at the Signal Transduction symposium, MSK 2026" data-caption="Jinki Yeom, Presentation of the Symposia for Signal Transduction">
            <img src="images/gallery/2026/2026-10-msk-staff-kim-nayoung-park-jumi.jpg" alt="Nayoung Kim and Jumi Park, staff members at MSK 2026" data-caption="Nayoung Kim and Jumi Park, staff members at MSK 2026">
            <img src="images/gallery/2026/2026-groisman-visit-2.jpg" alt="Dinner with Prof. Eduardo Groisman at the MSK" data-caption="Dinner with Prof. Eduardo Groisman">
          </div>
        </figure>
      </div>
    </section>
  </main>
  <script src="script.js?v=14"></script>
</body>
</html>
